<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>古诗词 · 开放知识库</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%234a9df6'/><text x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='serif'>诗</text></svg>" />
    <!-- 启动诊断（独立于模块脚本）：把模块加载 / 初始化期的错误直接写到启动页，
         避免用户永远卡在「正在翻开诗卷…」而不知原因。 -->
    <script>
      (function () {
        var errs = [];
        function show(msg) {
          var splash = document.getElementById('boot-splash');
          var tip = splash && splash.querySelector('.bs-tip');
          if (tip) {
            tip.textContent = msg;
            tip.style.color = '#b9701a';
          }
          var bar = splash && splash.querySelector('.bs-bar');
          if (bar) bar.style.display = 'none';
        }
        window.addEventListener('error', function (e) {
          var msg = e.error && e.error.message ? e.error.message : (e.message || '脚本错误');
          errs.push(msg);
          show('加载失败：' + msg + '（请刷新重试）');
        });
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason && (e.reason.message || e.reason);
          errs.push(String(reason || '未处理 Promise'));
          show('加载失败：' + String(reason || '初始化异常') + '（请刷新重试）');
        });
        // 看门狗：12s 后 Vue 仍未接管，给出超时提示（不再诬陷缓存）
        setTimeout(function () {
          var app = document.getElementById('app');
          var mounted = app && app.children.length > 0;
          if (!mounted && errs.length === 0) {
            show('加载超时，请检查网络后刷新重试');
          }
        }, 12000);
      })();
    </script>
    <!--
      首屏占位：HTML 一解析完就画出品牌加载页。
      JS 分包下载/解析期间（弱网或冷启动可达数秒）页面是空白的，
      这段内联样式让首帧就有画面，避免「白屏」。Vue 挂载后由 main.js 移除。
    -->
    <!-- Bridge 身份：必须在 api.js 之前声明，供基座/调试通道识别当前 H5 子应用 -->
    <script>
      window.__H5_APP_ID__ = 'gushici'
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(180deg, #f3f9ff 0%, #e6f2ff 100%);
        color: #2f7fd4;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      #boot-splash .bs-logo {
        font-size: 46px;
        letter-spacing: 6px;
        font-weight: 700;
      }
      #boot-splash .bs-tip {
        font-size: 14px;
        color: #5d6d7e;
      }
      #boot-splash .bs-bar {
        width: 132px;
        height: 3px;
        border-radius: 999px;
        background: #d6eaf8;
        overflow: hidden;
      }
      #boot-splash .bs-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #4a9df6;
        animation: bs-slide 1.1s ease-in-out infinite;
      }
      @keyframes bs-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }
      /* 翻开诗卷 Loading（与首屏一致，纯 CSS+SVG 内联，Vue 加载前即可显示） */
      .book-loading {
        --bl-size: 120px;
        --bl-page: #ffffff;
        --bl-page-edge: #e3edf7;
        --bl-ink: #b6c6da;
        --bl-shadow: rgba(31, 95, 168, 0.18);
        --bl-cover: #4a9df6;
        --bl-dur: 2s;
        position: relative;
        width: var(--bl-size);
        height: var(--bl-size);
        perspective: 600px;
      }
      .book-loading .bl-shadow {
        position: absolute;
        left: 14%; right: 14%; bottom: 12%;
        height: 7%;
        background: var(--bl-shadow);
        filter: blur(5px);
        border-radius: 50%;
      }
      .book-loading .bl-page {
        position: absolute;
        top: 20%; height: 64%;
        width: 42%;
        background: linear-gradient(100deg, var(--bl-page-edge) 0%, var(--bl-page) 32%, var(--bl-page) 100%);
        border-radius: 4px 9px 9px 4px;
        box-shadow: 0 4px 10px rgba(31, 95, 168, 0.12);
        transform-style: preserve-3d;
      }
      .book-loading .bl-left { left: 8%; transform-origin: right center; }
      .book-loading .bl-right {
        left: 50%;
        transform-origin: left center;
        animation: bl-flip var(--bl-dur) ease-in-out infinite;
      }
      .book-loading .bl-right::after {
        content: "";
        position: absolute;
        top: 0; right: 0;
        width: 34%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65));
        border-radius: 0 9px 9px 0;
        pointer-events: none;
      }
      .book-loading .bl-deco { position: absolute; inset: 14% 14% 14% 16%; width: auto; height: auto; overflow: visible; }
      .book-loading .bl-deco line { stroke: var(--bl-ink); stroke-width: 2.4; stroke-linecap: round; }
      .book-loading .bl-spine {
        position: absolute;
        top: 18%; left: 50%;
        transform: translateX(-50%);
        width: 3px; height: 68%;
        background: linear-gradient(var(--bl-cover), #2f7fd4);
        border-radius: 2px;
        opacity: 0.9;
      }
      @keyframes bl-flip {
        0% { transform: rotateY(0deg); }
        100% { transform: rotateY(-180deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .book-loading .bl-right { animation: none; transform: rotateY(-100deg); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-splash">
      <div class="book-loading" role="img" aria-label="正在翻开诗卷…">
        <div class="bl-shadow"></div>
        <div class="bl-page bl-left">
          <svg class="bl-deco" viewBox="0 0 50 80" preserveAspectRatio="none" aria-hidden="true">
            <line x1="8" y1="16" x2="42" y2="16" />
            <line x1="8" y1="28" x2="38" y2="28" />
            <line x1="8" y1="40" x2="42" y2="40" />
            <line x1="8" y1="52" x2="30" y2="52" />
          </svg>
        </div>
        <div class="bl-page bl-right">
          <svg class="bl-deco" viewBox="0 0 50 80" preserveAspectRatio="none" aria-hidden="true">
            <line x1="8" y1="16" x2="42" y2="16" />
            <line x1="8" y1="28" x2="38" y2="28" />
            <line x1="8" y1="40" x2="42" y2="40" />
            <line x1="8" y1="52" x2="30" y2="52" />
          </svg>
        </div>
        <div class="bl-spine"></div>
      </div>
      <div class="bs-tip">正在翻开诗卷…</div>
    </div>
    <!-- Bridge 中间件：相对路径引入，随子包分发。远程站点/浏览器预览时 window.RN 不存在，
         由 api.js 自动降级为 Mock，业务代码无需特殊处理 -->
    <script src="./js/api.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
